name: monthly-update

on:
  schedule:
    - cron: '20,35,50 23 27 2 *'
    - cron: '20,35,50 23 29 4,6,9,11 *'
    - cron: '20,35,50 23 30 1,3,5,7,8,10,12 *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  BASE: main
  HEAD: develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          cnt_pr=$(gh pr list --base ${{env.BASE}} --head ${{env.HEAD}} --state open --json number --jq 'length')
          if [ "$cnt_pr" -gt 0 ]; then
            echo "open な PR が既に存在するので、作成をスキップします"
            exit 0
          fi

          cnt_commit=$(git rev-list --count origin/${{env.BASE}}..origin/${{env.HEAD}})
          if [ "$cnt_commit" -eq 0 ]; then
            echo "差分が存在しないため、作成をスキップします"
            exit 0
          fi

          gh pr create --base ${{env.BASE}} --head ${{env.HEAD}} \
            --title "monthly update to main($(date +%Y/%m))" --body "自動作成($(date))"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
